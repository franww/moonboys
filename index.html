<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ff7aa8" />
  <title>Queres namorar comigo? 💖</title>

  <style>
    :root {
      --pink: #ff5f96;
      --pink-dark: #e9447e;
      --pink-soft: #ffd8e6;
      --cream: #fff8fb;
      --text: #5d2940;
      --shadow: 0 18px 50px rgba(170, 50, 100, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, #ffe2ec 0 7%, transparent 8%),
        radial-gradient(circle at 85% 15%, #ffd6e5 0 6%, transparent 7%),
        radial-gradient(circle at 10% 90%, #ffd3e3 0 8%, transparent 9%),
        linear-gradient(135deg, #fff6fa, #ffd8e8);
      display: grid;
      place-items: center;
      position: relative;
    }

    .floating-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      bottom: -40px;
      opacity: 0;
      animation: floatUp linear infinite;
      filter: drop-shadow(0 6px 6px rgba(200, 50, 100, 0.15));
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.7);
        opacity: 0;
      }

      10% {
        opacity: 0.75;
      }

      85% {
        opacity: 0.65;
      }

      100% {
        transform: translateY(-115vh) rotate(25deg) scale(1.2);
        opacity: 0;
      }
    }

    .card {
      width: min(92vw, 540px);
      padding: 38px 28px 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 30px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      position: relative;
      z-index: 2;
      animation: appear 700ms ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .bear {
      font-size: clamp(72px, 18vw, 115px);
      line-height: 1;
      display: inline-block;
      animation: bounce 1.8s ease-in-out infinite;
      transform-origin: bottom center;
      user-select: none;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0) rotate(-2deg);
      }

      50% {
        transform: translateY(-8px) rotate(2deg);
      }
    }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.08;
      letter-spacing: -1.5px;
    }

    .subtitle {
      margin: 0 auto 28px;
      max-width: 420px;
      font-size: clamp(16px, 3.8vw, 20px);
      color: #875168;
      line-height: 1.5;
    }

    .buttons-area {
      position: relative;
      min-height: 104px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 28px;
      min-width: 130px;
      font: inherit;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        background 180ms ease;
      touch-action: manipulation;
      user-select: none;
    }

    #yesBtn {
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      box-shadow: 0 10px 24px rgba(233, 68, 126, 0.34);
      z-index: 4;
    }

    #yesBtn:hover,
    #yesBtn:focus-visible {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 14px 28px rgba(233, 68, 126, 0.4);
      outline: none;
    }

    #noBtn {
      color: var(--text);
      background: #fff;
      box-shadow: 0 8px 22px rgba(120, 50, 80, 0.14);
      z-index: 5;
    }

    .hint {
      min-height: 24px;
      margin: 8px 0 0;
      color: #a4637e;
      font-size: 14px;
    }

    .success {
      display: none;
      text-align: center;
      animation: appear 500ms ease both;
    }

    .success.show {
      display: block;
    }

    .question.hide {
      display: none;
    }

    .success h2 {
      margin: 14px 0 10px;
      font-size: clamp(34px, 8vw, 55px);
      color: var(--pink-dark);
    }

    .success p {
      margin: 0;
      font-size: clamp(18px, 4.5vw, 23px);
      line-height: 1.5;
    }

    .big-heart {
      font-size: clamp(90px, 22vw, 145px);
      display: inline-block;
      animation: heartbeat 900ms ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      35% {
        transform: scale(1.12);
      }

      55% {
        transform: scale(1);
      }

      75% {
        transform: scale(1.08);
      }
    }

    .confetti {
      position: fixed;
      width: 12px;
      height: 12px;
      top: -20px;
      border-radius: 3px;
      z-index: 10;
      pointer-events: none;
      animation: fall 3.5s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(115vh) rotate(720deg);
        opacity: 0.2;
      }
    }

    .footer {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: rgba(93, 41, 64, 0.65);
      pointer-events: none;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 18px 24px;
        border-radius: 24px;
      }

      .buttons-area {
        min-height: 130px;
        gap: 12px;
      }

      button {
        min-width: 115px;
        padding: 13px 22px;
        font-size: 17px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="floating-hearts" id="floatingHearts" aria-hidden="true"></div>

  <main class="card">
    <section class="question" id="question">
      <div class="bear" aria-hidden="true">🧸</div>
      <h1>Queres namorar comigo? 💖</h1>
      <p class="subtitle">
        Prometo muitos sorrisos, abraços apertados e momentos bonitos ao teu lado.
      </p>

      <div class="buttons-area" id="buttonsArea">
        <button id="yesBtn" type="button">Sim! 💘</button>
        <button id="noBtn" type="button">Não 🙈</button>
      </div>

      <p class="hint" id="hint">Escolhe com o coração... 😌</p>
    </section>

    <section class="success" id="success" aria-live="polite">
      <div class="big-heart" aria-hidden="true">💖</div>
      <h2>Eu sabia! 🥹</h2>
      <p>
        Agora é oficial: nós dois, muitas aventuras e um amor bem bonito. 💕
      </p>
    </section>
  </main>

  <div class="footer">Feito com carinho 💗</div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const hint = document.getElementById("hint");
    const question = document.getElementById("question");
    const success = document.getElementById("success");
    const floatingHearts = document.getElementById("floatingHearts");

    let escapes = 0;

    const funnyMessages = [
      "Ei! Pensa melhor 😳",
      "O botão está com vergonha 🙈",
      "Não vale escolher esse 😜",
      "Tenta o outro botão... 💖",
      "Está quase impossível dizer não 😌",
      "O destino quer um sim! ✨"
    ];

    function moveNoButton() {
      const margin = 12;
      const buttonRect = noBtn.getBoundingClientRect();
      const maxX = Math.max(margin, window.innerWidth - buttonRect.width - margin);
      const maxY = Math.max(margin, window.innerHeight - buttonRect.height - margin);

      const x = Math.floor(Math.random() * (maxX - margin + 1)) + margin;
      const y = Math.floor(Math.random() * (maxY - margin + 1)) + margin;

      noBtn.style.position = "fixed";
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      noBtn.style.margin = "0";

      escapes += 1;
      hint.textContent = funnyMessages[Math.min(escapes - 1, funnyMessages.length - 1)];

      const yesScale = Math.min(1 + escapes * 0.05, 1.35);
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      moveNoButton();
    });
    noBtn.addEventListener("focus", moveNoButton);

    yesBtn.addEventListener("click", () => {
      question.classList.add("hide");
      success.classList.add("show");
      createConfetti();
    });

    function createFloatingHearts() {
      const hearts = ["💖", "💕", "💗", "💘", "💓"];

      for (let i = 0; i < 18; i += 1) {
        const heart = document.createElement("span");
        heart.className = "heart";
        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        heart.style.left = `${Math.random() * 100}%`;
        heart.style.fontSize = `${16 + Math.random() * 22}px`;
        heart.style.animationDuration = `${7 + Math.random() * 7}s`;
        heart.style.animationDelay = `${Math.random() * 8}s`;
        floatingHearts.appendChild(heart);
      }
    }

    function createConfetti() {
      const pieces = ["💖", "💕", "✨", "🌸", "💗"];

      for (let i = 0; i < 70; i += 1) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.textContent = pieces[Math.floor(Math.random() * pieces.length)];
        piece.style.left = `${Math.random() * 100}vw`;
        piece.style.fontSize = `${14 + Math.random() * 16}px`;
        piece.style.animationDelay = `${Math.random() * 1.2}s`;
        piece.style.animationDuration = `${2.5 + Math.random() * 2}s`;
        document.body.appendChild(piece);

        setTimeout(() => piece.remove(), 5500);
      }
    }

    createFloatingHearts();
  </script>
</body>
</html>
